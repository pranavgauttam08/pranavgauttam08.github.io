name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build for the production origin
        env:
          SITE_URL: https://pranavgauttam08.github.io
        run: npm run build
      - name: Validate structured data (strict)
        env:
          SITE_URL: https://pranavgauttam08.github.io
        run: |
          npm run validate:strict -- --summary >> "$GITHUB_STEP_SUMMARY" || true
          npm run validate:strict
      - name: Tests
        run: npm test
